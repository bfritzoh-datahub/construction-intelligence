name: Check approved construction sources
on:
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python scripts/collect.py
      - name: Commit refreshed research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/numeric_updates.json
          git diff --cached --quiet || (git commit -m "Refresh approved construction research" && git push)
